name: chunki

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chunki}
      POSTGRES_USER: ${POSTGRES_USER:-chunki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL is internal-only. Do not expose port 5432 on the VPS.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chunki} -d ${POSTGRES_DB:-chunki}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8787
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-chunki}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}@postgres:5432/${POSTGRES_DB:-chunki}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env — see apps/server/README.md}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env — see apps/server/README.md}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8787/api/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (32+ random chars)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GRADING_PROVIDER: ${GRADING_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      PRODUCTION_JUDGE_PROVIDER: ${PRODUCTION_JUDGE_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      LAVA_TOP_API_KEY: ${LAVA_TOP_API_KEY:-}
      LAVA_TOP_BASE_URL: ${LAVA_TOP_BASE_URL:-}
      LAVA_TOP_OFFER_ID_MONTHLY: ${LAVA_TOP_OFFER_ID_MONTHLY:-}
      LAVA_TOP_OFFER_ID_YEARLY: ${LAVA_TOP_OFFER_ID_YEARLY:-}
      LAVA_TOP_WEBHOOK_LOGIN: ${LAVA_TOP_WEBHOOK_LOGIN:-}
      LAVA_TOP_WEBHOOK_PASSWORD: ${LAVA_TOP_WEBHOOK_PASSWORD:-}
    ports:
      - '127.0.0.1:8787:8787'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8787/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
